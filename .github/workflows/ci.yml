name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository files
        run: python3 scripts/check_repository.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        id: install
        run: npm ci
      - name: Lint
        id: lint
        run: npm run lint
      - name: Session client tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Build
        id: build
        # Check the build even if lint failed, so both results are visible.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Summarize frontend checks
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          {
            echo '### Frontend checks'
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| npm ci | $INSTALL_RESULT |"
            echo "| npm run lint | $LINT_RESULT |"
            echo "| npm run build | $BUILD_RESULT |"
            echo ''
            echo 'These checks do not deploy the site or verify login and voting scenarios.'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Match the PostgreSQL major version used by Neon staging.
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: naukma_vote_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d naukma_vote_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/naukma_vote_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/naukma_vote_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend and lint dependencies
        id: backend-install
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Regression tests
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: python -m unittest discover -s tests -v
      - name: Validate migrations on PostgreSQL
        working-directory: .
        run: |
          python -m alembic upgrade head
          python -m alembic check
